<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Garden</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        background: radial-gradient(
          circle at 50% 60%,
          #401625 0%,
          #150914 50%,
          #080206 100%
        );
        overflow: hidden;
      }

      .garden {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-end;
      }

      .flower {
        position: absolute;
        bottom: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: bottom center;
      }

      .flower-center {
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
      }
      .stem-center {
        height: 400px;
        animation: growCenter 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      /* Left Flower: tilted outwards to the left */
      .flower-left {
        left: calc(50% - 25px);
        transform: translateX(-50%) rotate(-18deg); /* Diagonal angle */
        z-index: 1;
      }
      .flower-left .flower-head {
        animation-delay: 2.3s; /* Blooms right after the center flower */
      }

      /* Right Flower: tilted outwards to the right */
      .flower-right {
        left: calc(50% + 25px);
        transform: translateX(-50%) rotate(18deg); /* Diagonal angle */
        z-index: 1;
      }
      .flower-right .flower-head {
        animation-delay: 2.5s;
      }

      /* Side Stems: slightly shorter so the center stays the focal point */
      .stem-side {
        height: 310px;
        animation: growSide 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        animation-delay: 0.25s;
      }

      /* Keyframes for the two heights */
      @keyframes growCenter {
        0% {
          height: 0;
        }
        100% {
          height: 400px;
        }
      }

      @keyframes growSide {
        0% {
          height: 0;
        }
        100% {
          height: 310px;
        }
      }

      .flower-stem {
        width: 6px;
        background: linear-gradient(to top, #1a4f49, #2dd4bf);
        border-radius: 3px;
        transform-origin: bottom center;
      }

      .flower-head {
        position: absolute;
        top: -30px;
        width: 70px;
        height: 70px;
        transform: scale(0);
        animation: bloom 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        animation-delay: 2s;
      }

      .petal {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 26px;
        height: 48px;
        background: linear-gradient(to top, #ff9966, #ff5e62);
        border-radius: 50% 50% 20% 20%;
        box-shadow: 0 0 12px rgba(255, 94, 98, 0.6);
        transform-origin: bottom center;
      }

      .petal-1 {
        transform: translate(-50%, -100%) rotate(0deg);
      }
      .petal-2 {
        transform: translate(-50%, -100%) rotate(36deg);
      }
      .petal-3 {
        transform: translate(-50%, -100%) rotate(72deg);
      }
      .petal-4 {
        transform: translate(-50%, -100%) rotate(-36deg);
      }
      .petal-5 {
        transform: translate(-50%, -100%) rotate(-72deg);
      }

      .center-disk {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        background: radial-gradient(circle, #fff3b0 30%, #ffe066 80%);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 12px rgba(255, 224, 102, 0.8);
      }

      @keyframes growStem {
        0% {
          height: 0px;
        }
        100% {
          height: 380px;
        }
      }

      @keyframes bloom {
        0% {
          transform: scale(0) rotate(-45deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      .stem-leaf {
        position: absolute;
        width: 48px;
        height: 20px;
        background: linear-gradient(135deg, #2c726c, #123733);
        border-radius: 50px 0 50px 0;
        transform-origin: left center;
        opacity: 0;
        animation: growLeaf 1.2s ease-out forwards;
      }

      @keyframes growLeaf {
        0% {
          opacity: 0;
          transform: scale(0) rotate(var(--rot, -30deg));
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(var(--rot, -30deg));
        }
      }
    </style>
  </head>
  <body>
    <div class="garden">
      <div class="flower flower-left">
        <div class="flower-stem stem-side">
          <div
            class="stem-leaf leaf-left"
            style="
              top: 100px;
              left: -38px;
              --rot: -35deg;
              animation-delay: 1.5s;
            "
          ></div>
          <div
            class="stem-leaf leaf-right"
            style="
              top: 100px;
              right: -55px;
              --rot: 35deg;
              animation-delay: 1.8s;
            "
          ></div>
        </div>
        <div class="flower-head">
          <div class="petal petal-1"></div>
          <div class="petal petal-2"></div>
          <div class="petal petal-3"></div>
          <div class="petal petal-4"></div>
          <div class="petal petal-5"></div>
          <div class="center-disk"></div>
        </div>
      </div>

      <div class="flower flower-center">
        <div class="flower-stem stem-center">
          <div
            class="stem-leaf leaf-left"
            style="
              top: 160px;
              left: -35px;
              --rot: -35deg;
              animation-delay: 1.2s;
            "
          ></div>
          <div
            class="stem-leaf leaf-right"
            style="
              top: 180px;
              right: -50px;
              --rot: 35deg;
              animation-delay: 1.5s;
            "
          ></div>
        </div>
        <div class="flower-head">
          <div class="petal petal-1"></div>
          <div class="petal petal-2"></div>
          <div class="petal petal-3"></div>
          <div class="petal petal-4"></div>
          <div class="petal petal-5"></div>
          <div class="center-disk"></div>
        </div>
      </div>

      <div class="flower flower-right">
        <div class="flower-stem stem-side">
          <div
            class="stem-leaf leaf-right"
            style="top: 90px; right: -50px; --rot: 35deg; animation-delay: 1.7s"
          ></div>
          <div
            class="stem-leaf leaf-left"
            style="top: 160px; left: -35px; --rot: -35deg; animation-delay: 2s"
          ></div>
        </div>
        <div class="flower-head">
          <!-- Your existing petals structure here -->
          <div class="petal petal-1"></div>
          <div class="petal petal-2"></div>
          <div class="petal petal-3"></div>
          <div class="petal petal-4"></div>
          <div class="petal petal-5"></div>
          <div class="center-disk"></div>
        </div>
      </div>
    </div>
  </body>
</html>
